<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jogo da Cobrinha</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #11998e, #38ef7d);
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    color: #fff;
  }
  h1 { font-size: 2.5rem; text-shadow: 2px 2px 4px rgba(0,0,0,.3); }
  #scoreboard {
    font-size: 1.2rem;
    display: flex;
    gap: 30px;
    background: rgba(255,255,255,.2);
    padding: 8px 24px;
    border-radius: 20px;
  }
  #canvas {
    background: #1b2a1b;
    border: 4px solid rgba(255,255,255,.7);
    border-radius: 12px;
  }
  .info { font-size: 1rem; background: rgba(255,255,255,.2); padding: 6px 18px; border-radius: 16px; }
  button {
    font-size: 1.1rem;
    padding: 12px 30px;
    border: none;
    border-radius: 8px;
    background: #fff;
    color: #11998e;
    font-weight: bold;
    cursor: pointer;
  }
  button:hover { opacity: .85; }
</style>
</head>
<body>
  <h1>Cobrinha</h1>
  <div id="scoreboard">
    <span>Pontos: <b id="score">0</b></span>
    <span>Recorde: <b id="high">0</b></span>
  </div>
  <canvas id="canvas" width="400" height="400"></canvas>
  <div class="info">Setas / WASD para mover &middot; Espaço pausa</div>
  <button id="restart">Reiniciar</button>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const highEl = document.getElementById('high');

const GRID = 20;
const CELLS = canvas.width / GRID;

let snake, dir, nextDir, food, score, gameActive, paused, timer;
let highScore = parseInt(localStorage.getItem('snakeHigh')) || 0;
highEl.textContent = highScore;

function reset() {
  snake = [{x: 9, y: 9}, {x: 8, y: 9}, {x: 7, y: 9}];
  dir = {x: 1, y: 0};
  nextDir = {x: 1, y: 0};
  score = 0;
  gameActive = true;
  paused = false;
  scoreEl.textContent = 0;
  spawnFood();
  clearInterval(timer);
  startLoop();
}

function spawnFood() {
  do {
    food = {x: Math.floor(Math.random() * CELLS), y: Math.floor(Math.random() * CELLS)};
  } while (snake.some(s => s.x === food.x && s.y === food.y));
}

function startLoop() {
  timer = setInterval(step, Math.max(60, 140 - score * 2));
}

function step() {
  if (!gameActive || paused) return;
  dir = nextDir;
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

  if (head.x < 0 || head.y < 0 || head.x >= CELLS || head.y >= CELLS ||
      snake.some(s => s.x === head.x && s.y === head.y)) {
    gameOver();
    return;
  }

  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score++;
    scoreEl.textContent = score;
    if (score > highScore) {
      highScore = score;
      localStorage.setItem('snakeHigh', highScore);
      highEl.textContent = highScore;
    }
    spawnFood();
    clearInterval(timer);
    startLoop();
  } else {
    snake.pop();
  }
  draw();
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#2a3b2f';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  for (let y = 0; y < CELLS; y++) {
    for (let x = 0; x < CELLS; x++) {
      ctx.fillStyle = (x + y) % 2 === 0 ? '#2a3b2f' : '#26332a';
      ctx.fillRect(x * GRID, y * GRID, GRID, GRID);
    }
  }
  ctx.fillStyle = '#e74c3c';
  ctx.fillRect(food.x * GRID + 3, food.y * GRID + 3, GRID - 6, GRID - 6);
  snake.forEach((s, i) => {
    ctx.fillStyle = i === 0 ? '#38ef7d' : '#2fa865';
    ctx.fillRect(s.x * GRID + 1, s.y * GRID + 1, GRID - 2, GRID - 2);
  });
}

function gameOver() {
  gameActive = false;
  clearInterval(timer);
  ctx.fillStyle = 'rgba(0,0,0,.6)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 28px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('Fim de jogo!', canvas.width / 2, canvas.height / 2 - 10);
  ctx.font = '18px Arial';
  ctx.fillText(`Pontos: ${score}`, canvas.width / 2, canvas.height / 2 + 24);
}

addEventListener('keydown', e => {
  if (e.key === ' ') {
    e.preventDefault();
    if (gameActive) paused = !paused;
    return;
  }
  const moves = {
    ArrowUp: {x: 0, y: -1},
    ArrowDown: {x: 0, y: 1},
    ArrowLeft: {x: -1, y: 0},
    ArrowRight: {x: 1, y: 0},
    w: {x: 0, y: -1},
    s: {x: 0, y: 1},
    a: {x: -1, y: 0},
    d: {x: 1, y: 0}
  };
  const m = moves[e.key.toLowerCase()];
  if (m && !(m.x === -dir.x && m.y === -dir.y)) nextDir = m;
});

document.getElementById('restart').addEventListener('click', reset);

reset();
draw();
</script>
</body>
</html>
